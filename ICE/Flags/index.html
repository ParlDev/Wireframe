<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Stories — Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery">
    <article class="poster chile-poster">
      <div class="poster-photo chile-photo"></div>
      <div class="flag chile">
        <div class="flag_chi">
          <div class="blue">&#9733;</div>
          <div class="white"></div>
          <div class="red"></div>
          <div class="red"></div>
        </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>South America</p><h1>CHILE</h1><small>Mountain / Coast</small></div>
    </article>
    <article class="poster denmark-poster">
      <div class="poster-photo denmark-photo"></div>
      <div class="flag denmark">
        <div class="flag_den">
          <div class="red"></div>
          <div class="white"></div>
          <div class="red"></div>
          <div class="white"></div>
          <div class="white"></div>
          <div class="white"></div>
          <div class="red"></div>
          <div class="white"></div>
          <div class="red"></div>
        </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Scandinavia</p><h1>DENMARK</h1><small>North Sea / Light</small></div>
    </article>
    <article class="poster finland-poster">
      <div class="poster-photo finland-photo"></div>
      <div class="flag finland">
        <div class="flag_fin">
          <div class="red"></div>
          <div class="white"></div>
          <div class="red"></div>
          <div class="white"></div>
          <div class="white"></div>
          <div class="white"></div>
          <div class="red"></div>
          <div class="white"></div>
          <div class="red"></div>
        </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Nordic Forests</p><h1>FINLAND</h1><small>Forest / Water</small></div>
    </article>
    <article class="poster car-poster">
      <div class="poster-photo car-photo"></div>
      <div class="flag car">
        <div class="flag_car">
        <div class="blue"><span class="star">&#9733;</span></div>
        <div class="red"></div>
        <div class="blue"></div>
        <div class="white"></div>
        <div class="red"></div>
        <div class="white"></div>
        <div class="green"></div>
        <div class="red"></div>
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
        <div class="yellow"></div>
        </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Central Africa</p><h1>C.A.R.</h1><small>River / Savanna</small></div>
    </article>
  </main>
</body>
</html>
